<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><title>Softdrink</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#fdf6f0;--card:#fff;--tx:#2a1a17;--mut:#7a6a64;--ln:#eadcd3;--pr:#d7263d;--prt:#fff;--bad:#b3261e;--ok:#0f6e56;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}

:root[data-theme="dark"]{--bg:#1a1211;--card:#271a18;--tx:#f6ece8;--mut:#b5a29b;--ln:#43302c;--pr:#ff6b78;--prt:#2b0508;--bad:#ff8a80;--ok:#3ecf9f;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:860px;margin:0 auto;padding:14px 14px 96px}
h1{font-size:19px;margin:0}h2{font-size:16px;margin:0 0 8px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
button,select,input{font:inherit;color:var(--tx)}
.tab,.btn{border:1px solid var(--ln);background:var(--card);padding:8px 14px;border-radius:99px;cursor:pointer}
.tab.on,.btn.pr{background:var(--pr);color:var(--prt);border-color:var(--pr)}
.btn.sm{padding:4px 11px;font-size:13px}.btn[disabled]{opacity:.45;cursor:not-allowed}
label.btn{display:inline-block}
.card{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:14px;margin-bottom:12px}
input,select{background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:9px;width:100%}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1;min-width:110px}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--ln)}
.item:last-child{border:0}.mut{color:var(--mut);font-size:13px}
.qty{display:flex;align-items:center;gap:8px}.qty b{min-width:20px;text-align:center}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;border:1px solid var(--ln)}
.open{color:var(--ok);border-color:var(--ok)}.closed{color:var(--bad);border-color:var(--bad)}
.banner{padding:10px 14px;border-radius:12px;margin-bottom:12px;border:1px solid}
.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:6px 8px;border-bottom:1px solid var(--ln);text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.stat{border:1px solid var(--ln);border-radius:14px;padding:10px;background:var(--card)}.stat b{display:block;font-size:18px}
.debt{color:var(--bad)}.good{color:var(--ok)}
.sub{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.hero{background:linear-gradient(135deg,#d7263d,#7a0f1f);color:#fff;border-radius:22px;padding:22px 18px;margin-bottom:12px}
.hero .badge{color:#fff;border-color:rgba(255,255,255,.55)}.hero .emo{font-size:22px;letter-spacing:4px;margin-top:8px}
.ht{font-size:28px;font-weight:700;line-height:1.15;margin:10px 0 6px}.hero p{margin:0 0 14px;opacity:.92}
.hb{border:1px solid #fff;background:#fff;color:#7a0f1f;border-radius:99px;padding:9px 18px;cursor:pointer;font-weight:600;margin:0 6px 6px 0}
.hb.g{background:transparent;color:#fff;border-color:rgba(255,255,255,.6)}
.mg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.mc{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:10px;display:grid;gap:3px;justify-items:start;align-content:start}
.em{font-size:34px}.mc .qty{margin-top:6px}.soon{border-style:dashed;text-align:center}
.ph{position:relative;width:100%;justify-self:stretch;aspect-ratio:4/3;border-radius:12px;overflow:hidden;background:var(--bg);display:grid;place-items:center;margin-bottom:4px}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mc.out .ph img,.mc.out .ph .em{filter:grayscale(1)}
.so{position:absolute;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center}
.so span{background:var(--bad);color:#fff;font-weight:800;letter-spacing:1.5px;font-size:14px;padding:5px 14px;border-radius:8px;transform:rotate(-8deg);border:2px solid #fff}
.mc.out b,.mc.out .mut{opacity:.6}
#toast{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--pr);color:var(--prt);padding:10px 18px;border-radius:99px;z-index:60;font-weight:600;box-shadow:0 4px 16px rgba(0,0,0,.3);max-width:92%;text-align:center}
#nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:860px;display:flex;background:var(--card);border-top:1px solid var(--ln);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
.nb{flex:1;background:none;border:0;display:grid;justify-items:center;gap:1px;font-size:11px;color:var(--mut);padding:4px;cursor:pointer;position:relative}
.nb span{font-size:21px}.nb.on{color:var(--pr);font-weight:600}
.nb i{position:absolute;top:0;left:56%;background:var(--pr);color:var(--prt);font-style:normal;font-size:10px;border-radius:99px;padding:1px 6px}
#splash{position:fixed;inset:0;z-index:50;display:grid;place-content:center;gap:10px;text-align:center;background:linear-gradient(160deg,#d7263d,#7a0f1f);color:#fff;transition:opacity .4s}
#splash.off{opacity:0;pointer-events:none}#splash .es{font-size:34px;letter-spacing:6px;animation:bob 1.1s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-8px)}}@keyframes up{from{opacity:0;transform:translateY(8px)}}
#skip{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:16px;background:none;border:0;color:#fff;font-size:15px;cursor:pointer}
#buyer>*{animation:up .3s both}
</style></head><body><main>
<div id="splash"><button id="skip">Lewati ›</button><div class="es">🥤🥤🥤🥤🥤</div><div style="font-size:26px;font-weight:700">Softdrink</div><div style="opacity:.85">Segar setiap tegukan</div></div>
<div id="toast" hidden></div>
<header class="top"><h1 id="shop">🥤 Softdrink</h1><span id="stat" class="badge">…</span></header>
<div class="tabs"><button class="tab on" data-t="buyer">Pesan Sekarang</button><button class="tab" data-t="kasir">🔒 Kasir</button></div>
<div id="buyer"></div><div id="kasir" hidden></div>
<nav id="nav"></nav>
</main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {initializeAuth,browserSessionPersistence,signInWithEmailAndPassword,signOut,updatePassword,sendPasswordResetEmail} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
/* ====== ISI BAGIAN INI DENGAN DATA FIREBASE ANDA (lihat PANDUAN.md) ====== */
const CFG={apiKey:"AIzaSyDmjqdkEEFbKu7PsnI4uvCbigo83fA6WuQ",authDomain:"toko-softdrink-b4efe.firebaseapp.com",projectId:"toko-softdrink-b4efe",appId:"1:548360039845:web:b4cc9ccbbaa2e7a0f4cc4c",ownerEmail:"email-pemilik@gmail.com"};
/* ========================================================================= */
const app=initializeApp(CFG),fs=getFirestore(app),auth=initializeAuth(app,{persistence:[browserSessionPersistence]}),noop=()=>{};
const wd=s=>({exists:s.exists(),data:()=>s.data()}),dr=p=>doc(fs,...p.split('/'));
const dbx={doc:p=>({get:async()=>wd(await getDoc(dr(p))),set:d=>setDoc(dr(p),d),update:d=>updateDoc(dr(p),d),delete:()=>deleteDoc(dr(p)),onSnapshot:(cb,er)=>onSnapshot(dr(p),x=>cb(wd(x)),er||noop)}),
 collection:p=>({add:d=>addDoc(collection(fs,p),d),onSnapshot:(cb,er)=>onSnapshot(collection(fs,p),cb,er||noop)})};
const shrink=(f,mx=900,q=.8)=>new Promise((ok,no)=>{const i=new Image();i.onload=()=>{const k=Math.min(1,mx/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',q))};i.onerror=no;i.src=URL.createObjectURL(f)});
window.claude={use:async n=>{
 if(n==='user')return{canEdit:async()=>{await auth.authStateReady();return !!auth.currentUser&&auth.currentUser.email===CFG.ownerEmail}};
 if(n==='db'){await auth.authStateReady();return dbx}
 if(n==='assets')return{upload:async f=>({id:await shrink(f)})}}};
window.fbLogin=async p=>{await signInWithEmailAndPassword(auth,CFG.ownerEmail,p);sessionStorage.setItem('k','1');location.reload()};
window.fbLogout=async()=>{await signOut(auth);location.reload()};
window.fbChangePin=p=>updatePassword(auth.currentUser,p);
window.fbReset=()=>sendPasswordResetEmail(auth,CFG.ownerEmail);
window.bump=async(items,sg,d)=>{for(const i of items)if(i.id&&/^u\d/.test(i.id))await setDoc(doc(fs,'sold',(d||today())+'_'+i.id),{n:increment(sg*i.q)},{merge:true})};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rp=n=>'Rp '+Math.round(n||0).toLocaleString('id-ID'),pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const HN=['Muharram','Safar','Rabiul Awal','Rabiul Akhir','Jumadil Awal','Jumadil Akhir','Rajab','Syaban','Ramadhan','Syawal','Dzulkaidah','Dzulhijjah'];
const hf=new Intl.DateTimeFormat('en-u-ca-islamic-umalqura',{year:'numeric',month:'numeric',day:'numeric'});
function hij(s){const [y,m,d]=s.split('-').map(Number),p=hf.formatToParts(new Date(y,m-1,d,12)),g=t=>+p.find(x=>x.type===t).value;return{y:g('year'),m:g('month'),d:g('day')}}
const hlabel=s=>{const h=hij(s);return h.d+' '+HN[h.m-1]+' '+h.y+' H'};
function wk(s){const [y,m,d]=s.split('-').map(Number),dt=new Date(y,m-1,d);dt.setDate(dt.getDate()-(dt.getDay()+6)%7);const a=ymd(dt);dt.setDate(dt.getDate()+6);return[a,ymd(dt)]}
const CATS=['Toko','Unit 1','Unit 2','Unit 3','Unit 4','Unit 5','Unit 6'];
let db=null,user=null,store={mode:'auto',open:'08:00',close:'21:00',name:'Softdrink'},menu=[],orders=[],daily={},setor={},proofFile=null,unlocked=false,sub='sale',imgs={};
let bc={},kc={},bname='',bnote='',bmeth='cash',kname='',kmeth='cash',kpaid=true,rdate=ymd(new Date()),msg='';
const today=()=>ymd(new Date());const un=k=>(store.units&&store.units[k-1])||'Unit '+k,uname=c=>c==='Toko'?'Toko':un(+c.slice(5));
function isOpen(){if(store.mode==='buka')return true;if(store.mode==='tutup')return false;const n=new Date(),t=pad(n.getHours())+':'+pad(n.getMinutes());return store.open<=store.close?(t>=store.open&&t<store.close):(t>=store.open||t<store.close)}
function paintStatus(){const o=isOpen(),e=$('#stat');e.textContent=o?'● BUKA · tutup '+store.close:'● TUTUP · buka '+store.open;e.className='badge '+(o?'open':'closed');$('#shop').textContent='🥤 '+(store.name||'Softdrink')}
setInterval(()=>{paintStatus();if(!$('#buyer').hidden)buyerUI()},30000);
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));$('#buyer').hidden=b.dataset.t!=='buyer';$('#nav').hidden=b.dataset.t!=='buyer';$('#kasir').hidden=b.dataset.t!=='kasir';b.dataset.t==='kasir'?kasirGate():buyerUI()});

/* ---------- SUARA & NOTIFIKASI (kasir) ---------- */
let snd=true;try{snd=localStorage.getItem('snd')!=='0'}catch(e){}
let ac=null,ordInit=false,tt=null;
const initAudio=()=>{try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch(e){}};
['pointerdown','keydown','touchend'].forEach(ev=>document.addEventListener(ev,initAudio,{passive:true}));
function ding(){if(!ac)return;const t=ac.currentTime;[[880,0],[1175,.16],[1568,.32]].forEach(([f,d])=>{const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0.0001,t+d);g.gain.linearRampToValueAtTime(.45,t+d+.02);g.gain.exponentialRampToValueAtTime(.001,t+d+.5);o.connect(g);g.connect(ac.destination);o.start(t+d);o.stop(t+d+.55)})}
function chime(){initAudio();ding();setTimeout(ding,900);try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}
function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(tt);tt=setTimeout(()=>e.hidden=true,6000)}
function newOrders(s){if(ordInit&&unlocked){const n=s.docChanges().filter(c=>c.type==='added'&&!c.doc.metadata.hasPendingWrites&&c.doc.data().src==='online').map(c=>c.doc.data());if(n.length){if(snd)chime();toast('🔔 Pesanan baru dari '+n[0].name+(n.length>1?' (+'+(n.length-1)+' lagi)':''))}}ordInit=true}

/* ---------- PEMBELI ---------- */
let soldMap={};function sold(id){return soldMap[today()+'_'+id]||0}
function live(){const L=[...menu];CATS.slice(1).forEach((c,k)=>{const u=setor['u'+(k+1)];if(!u)return;[['nasi','Nasi','pn'],['batagor','Batagor','pb']].forEach(([key,nm,pk])=>{if(u[key]>0){const id='u'+(k+1)+'-'+key;L.push({id,n:nm,p:u[pk]||0,cat:c,stock:u[key]-sold(id)})}})});return L}
const isOut=m=>!!m.out||(m.stock!==undefined&&m.stock<=0);
function cartTotal(c){return live().reduce((s,m)=>s+(c[m.id]||0)*m.p,0)}
const emo=n=>{n=n.toLowerCase();return/nasi/.test(n)?'🍚':/batagor|siomay/.test(n)?'🥟':/air|aqua|mineral/.test(n)?'💧':/teh/.test(n)?'🍵':/kopi/.test(n)?'☕':/jeruk|orange/.test(n)?'🍊':'🥤'};
const th=(m,s)=>imgs[m.id]?`<img src="${imgs[m.id]}" alt="" style="width:${s}px;height:${s}px;object-fit:cover;border-radius:10px;flex:none">`:`<span style="font-size:${Math.round(s*.6)}px;width:${s}px;text-align:center;flex:none">${emo(m.n)}</span>`;
function menuList(c,fn){let h='';CATS.forEach(cat=>{const L=live().filter(m=>m.cat===cat);if(!L.length)return;h+=`<div class="mut" style="margin-top:8px">${cat==='Toko'?'Menu Toko':'Setoran '+uname(cat)}</div>`;L.forEach(m=>h+=`<div class="item"><div style="display:flex;gap:10px;align-items:center;min-width:0">${th(m,44)}<div>${esc(m.n)}${isOut(m)?' <span class="badge closed">SOLD OUT</span>':''}<div class="mut">${rp(m.p)}${m.stock!==undefined&&m.stock>0?' · Sisa '+m.stock:''}</div></div></div><div class="qty">${fn==='k'&&m.stock===undefined?`<button class="btn sm" data-o="${m.id}">${m.out?'Sedia':'Habis'}</button>`:''}<button class="btn sm" data-a="${fn}" data-d="-1" data-i="${m.id}">−</button><b>${c[m.id]||0}</b><button class="btn sm" data-a="${fn}" data-d="1" data-i="${m.id}" ${isOut(m)||(m.stock!==undefined&&(c[m.id]||0)>=m.stock)?'disabled':''}>+</button></div></div>`)});return h||'<p class="mut">Menu belum tersedia.</p>'}
let bpage='home',qmsg='';
const cnt=c=>Object.values(c).reduce((a,b)=>a+b,0),blur=()=>document.activeElement&&document.activeElement.blur&&document.activeElement.blur();
const go=p=>{blur();bpage=p;buyerUI();scrollTo(0,0)};
const stp=(m,c)=>{const q=c[m.id]||0,mx=isOut(m)||(m.stock!==undefined&&q>=m.stock);return`<div class="qty"><button class="btn sm" data-a="b" data-d="-1" data-i="${m.id}">−</button><b>${q}</b><button class="btn sm" data-a="b" data-d="1" data-i="${m.id}" ${mx?'disabled':''}>+</button></div>`};
const cards=(c,l)=>`<div class="mg">${l.map(m=>`<div class="mc${isOut(m)?' out':''}"><div class="ph">${imgs[m.id]?`<img src="${imgs[m.id]}" alt="${esc(m.n)}" loading="lazy">`:`<span class="em">${emo(m.n)}</span>`}${isOut(m)?'<div class="so"><span>SOLD OUT</span></div>':''}</div><b>${esc(m.n)}</b><div class="mut">${rp(m.p)}${m.stock!==undefined&&m.stock>0?' · Sisa '+m.stock:''}</div>${stp(m,c)}</div>`).join('')}</div>`;
function quick(t){const L=live();let n=0;t.toLowerCase().split(/[,\n]+/).forEach(p=>{const m=p.match(/(\d+)/),q=m?+m[1]:1,w=p.replace(/\d+/g,'').trim();if(!w)return;const f=L.find(x=>{const k=x.n.toLowerCase();return k.includes(w)||w.includes(k)});if(f&&!isOut(f)){bc[f.id]=Math.min(f.stock===undefined?1e9:f.stock,(bc[f.id]||0)+q);n++}});return n}
function buyerUI(){
 const ac=document.activeElement;if(ac&&ac.tagName==='INPUT'&&ac.type!=='file'&&$('#buyer').contains(ac))return;
 const el=$('#buyer'),o=isOpen(),L=live();
 $('#nav').innerHTML=[['home','🏠','Home'],['menu','📋','Menu'],['cart','🛒','Keranjang'],['profil','👤','Profil']].map(([k,i,l])=>`<button class="nb ${bpage===k?'on':''}" data-go="${k}"><span>${i}</span>${l}${k==='cart'&&cnt(bc)?`<i>${cnt(bc)}</i>`:''}</button>`).join('');
 if(!db){el.innerHTML='<div class="card">Memuat… (jika tidak muncul, periksa koneksi internet)</div>';bindB();return}
 const ban=`<div class="banner ${o?'open':'closed'}">${o?'Kami sedang BUKA. Silakan pesan!':'Kami sedang TUTUP. Pemesanan dibuka kembali pukul '+store.open+'.'}</div>`;
 const form=`<div class="card"><h2>Data pemesan</h2><div class="row"><input id="bn" placeholder="Nama Anda" value="${esc(bname)}"><input id="bt" placeholder="Catatan / alamat / WA" value="${esc(bnote)}"></div></div>`;
 const qr=store.qris?`<div style="margin-top:10px;text-align:center"><div class="mut">QRIS Toko – scan untuk membayar</div><img src="${store.qris}" alt="QRIS toko" style="max-width:240px;width:100%;border-radius:12px"></div>`:'';
 let h='';
 if(bpage==='home'){const od=orders.filter(x=>x.date===today()).length;
  h=`<section class="hero"><span class="badge">🥤 ${esc(store.name)}</span><div class="ht">Segar setiap tegukan.</div><p>Minuman dingin, nasi &amp; batagor titipan. Pesan dari HP-mu, ambil di toko — tanpa antre.</p><button class="hb" data-go="menu">Lihat Menu</button><button class="hb g" data-go="profil">Tentang Toko</button><div class="emo">🥤🧊🥤🧊🥤</div></section>
  ${ban}<div class="card"><h2>✍️ Pesan Cepat</h2><p class="mut">Ketik pesananmu, misalnya “cola 2, batagor 1”.</p><div class="row"><input id="qo" placeholder="cola 2, batagor 1"><button class="btn pr" id="qb">Proses Pesanan</button></div><p class="mut">${esc(qmsg)}</p></div>
  <div class="grid" style="margin-bottom:12px"><div class="stat"><span class="mut">Pesanan hari ini</span><b>${od}</b></div><div class="stat"><span class="mut">Pilihan menu</span><b>${L.length}</b></div><div class="stat"><span class="mut">Status</span><b class="${o?'good':'debt'}">${o?'Buka':'Tutup'}</b></div><div class="stat"><span class="mut">Jam toko</span><b>${store.open}–${store.close}</b></div></div>
  <div class="card soon"><span class="badge">✨ Segera Hadir</span><h2 style="margin-top:8px">Kumpulkan Poin, Tukar Hadiah!</h2><p class="mut">Sebentar lagi setiap pesananmu menghasilkan poin yang bisa ditukar menu gratis. Nantikan ya! 🎁</p></div>`}
 else if(bpage==='menu'){h=ban+(CATS.map(c=>{const l=L.filter(m=>m.cat===c);return l.length?`<div class="mut" style="margin:10px 0 6px">${c==='Toko'?'Menu Toko':'Setoran '+esc(uname(c))}</div>`+cards(bc,l):''}).join('')||'<div class="card mut">Menu belum tersedia.</div>')}

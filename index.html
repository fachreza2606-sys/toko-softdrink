const shr1=(f,m,q)=>new Promise((ok,no)=>{const i=new Image(),u=URL.createObjectURL(f);i.onload=()=>{const k=Math.min(1,m/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',q))};i.onerror=()=>{URL.revokeObjectURL(u);no(new Error('img'))};i.src=u});

 const sv=d=>{const m={};if('logo' in d)m.logo=d.logo;if('wall' in d)m.wall=d.wall;if('mode' in d)m.wmode=d.mode;const n={...store,...m};if(JSON.stringify(n).length>950000)return Promise.reject(new Error('Ukuran data terlalu besar (maks sekitar 1 MB). Kecilkan foto atau gambar QRIS.'));return db.doc('config/store').set(n)};

 $('#ss').onclick=()=>db.doc('config/store').set({...store,name:$('#sn').value,open:$('#so').value||'08:00',close:$('#sc').value||'21:00',mode:$('#sm').value,qris:store.qris||null});
 const sv=a=>db.doc('menu/main').set({items:a});
 $('#ma').onclick=async()=>{const n=$('#mn').value.trim(),p=+$('#mp').value;if(!n||!p)return;const it={id:'m'+Date.now(),n,p,cat:$('#mc').value},f=$('#mfi').files[0];if(f){try{it.img=await shr(f,320,.72)}catch(x){alert('Foto tidak bisa dibaca, menu disimpan tanpa foto.')}}
  try{await mput([...menu,it])}catch(x){gagalM(x)}};
 const gagalM=x=>alert('Gagal menyimpan menu.\n\nDetail: '+((x&&(x.code||x.message))||x));
 const mput=a=>{if(JSON.stringify({items:a}).length>950000)return Promise.reject(new Error('Total ukuran foto menu terlalu besar. Hapus beberapa foto dulu.'));return sv(a)};
 const mset=(id,img)=>mput(menu.map(m=>{if(m.id!==id)return m;const r={...m};if(img)r.img=img;else delete r.img;return r}));
 $('#kb').querySelectorAll('[data-mf]').forEach(i=>i.onchange=async e=>{const f=e.target.files[0];if(!f)return;let img;try{img=await shr(f,320,.72)}catch(x){return alert('Foto tidak bisa dibaca. Pakai JPG atau PNG.')}try{await mset(i.dataset.mf,img)}catch(x){gagalM(x)}});
 $('#kb').querySelectorAll('[data-mx]').forEach(b=>b.onclick=()=>mset(b.dataset.mx,'').catch(gagalM));
 $('#kb').querySelectorAll('[data-so]').forEach(b=>b.onclick=()=>togSO(b.dataset.so));
 $('#kb').querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>sv(menu.filter(m=>m.id!==b.dataset.d)));
 $('#qf').onchange=async e=>{const f=e.target.files[0];if(!f)return;const a=await claude.use('assets');if(!a)return alert('Upload tidak tersedia.');const r=await a.upload(f);await db.doc('config/store').set({...store,qris:r.id})}}

const sp=$('#splash');try{if(sessionStorage.getItem('sp'))sp.remove()}catch(e){}
const hideSp=()=>{if(!sp.isConnected)return;try{sessionStorage.setItem('sp','1')}catch(e){}sp.classList.add('off');setTimeout(()=>sp.remove(),400)};
$('#skip').onclick=hideSp;setTimeout(hideSp,2400);
/* ---------- INIT ---------- */
if(FID){document.querySelector('.tabs').hidden=true;$('#nav').hidden=true;$('#buyer').hidden=true;$('#fv').hidden=false;fview()}
buyerUI();paintStatus();
(async()=>{try{
 user=await claude.use('user');db=await claude.use('db');if(!db){buyerUI();return}
  if(FID)db.doc('foto/'+FID).get().then(s=>{fimg=s.exists?s.data().img:null;fview()}).catch(()=>{});
 db.collection('orders').onSnapshot(s=>{if(!firstOrd&&unlocked&&!FID)s.docChanges().forEach(c=>{if(c.type==='added'&&!c.doc.metadata.hasPendingWrites&&c.doc.data().src==='online'){beep();flashTitle()}});firstOrd=false;orders=s.docs.map(d=>({id:d.id,...d.data()}));buyerUI();kasirParts();if(FID)fview()},()=>{});
 db.collection('sold').onSnapshot(s=>{soldMap={};s.docs.forEach(d=>soldMap[d.id]=d.data().n||0);buyerUI();kasirParts()});let sd=today(),su=null;const subS=()=>{su&&su();sd=today();su=db.doc('setoran/'+sd).onSnapshot(s=>{setor=s.exists?s.data():{};buyerUI();if(unlocked){if(sub==='sale')saleUI();else if(sub==='stk'&&document.activeElement===document.body)stkUI();else kasirParts()}},()=>{})};subS();setInterval(()=>{if(sd!==today())subS()},60000);
 db.doc('config/store').onSnapshot(s=>{if(s.exists)store={...store,...s.data()};tema={wall:store.wall||'',logo:store.logo||'',mode:store.wmode||'hero'};applyTema();paintStatus();buyerUI();if(unlocked&&sub==='set'&&document.activeElement===document.body)setUI()});
 db.doc('menu/main').onSnapshot(s=>{menu=s.exists?(s.data().items||[]):[];buyerUI();if(unlocked){if(sub==='sale')saleUI();else if(sub==='set')setUI()}});
}catch(e){buyerUI()}})();
if(sessionStorage.getItem('k')){sessionStorage.removeItem('k');const iv=setInterval(()=>{if(db){clearInterval(iv);document.querySelector('[data-t=kasir]').click()}},200)}
</script></body></html>
